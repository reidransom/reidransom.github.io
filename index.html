<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reid Ransom - Redirecting...</title>
    <meta name="description" content="Redirecting to Reid Ransom's website">
    <meta name="author" content="Reid Ransom">
    
    <!-- Redirect using meta refresh -->
    <meta http-equiv="refresh" content="0; url=https://reidransom.com">
    
    <!-- Canonical link for SEO -->
    <link rel="canonical" href="https://reidransom.com">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .redirect-message {
            text-align: center;
        }
        .redirect-message h1 {
            margin-bottom: 1rem;
        }
        .redirect-message a {
            color: #0066cc;
            text-decoration: none;
        }
        .redirect-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>Redirecting...</h1>
        <p>You are being redirected to <a href="https://reidransom.com">reidransom.com</a></p>
        <p>If you are not redirected automatically, <a href="https://reidransom.com">click here</a>.</p>
    </div>
    
    <script>
        // JavaScript redirect as fallback
        window.location.href = "https://reidransom.com";
    </script>
</body>
</html>
